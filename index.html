<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>돌고래 대시</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
/* Layout: one full-bleed canvas sea; HUD floats at the top, cards sit centered over the water.
   Single visual world (pastel sea, ink outlines with cyan/pink offset like the dolphin artwork), so no dark-mode variant. */
:root{
  --ink:#4b2f8f;
  --cyan:#43d3df;
  --pink:#e04aa9;
  --foam:#f6f2ff;
  --sun:#f8d64a;
  --deep:#7a55b8;
  --display:"Jua","Arial Rounded MT Bold","Malgun Gothic",system-ui,sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--deep);color:var(--ink);font-family:var(--body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0}
#cv{display:block;width:100%;height:100%;touch-action:none;cursor:pointer}

#hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:14px;
  padding:calc(14px + env(safe-area-inset-top,0px)) 16px 0;pointer-events:none;flex-wrap:wrap}
.bar{flex:1 1 220px;height:16px;border:3px solid var(--ink);border-radius:999px;background:rgba(246,242,255,.55);
  box-shadow:-3px -2px 0 var(--cyan),3px 2px 0 var(--pink);overflow:hidden;min-width:0}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--foam) 60%,var(--sun))}
.stat{font-family:var(--display);font-size:20px;color:var(--foam);text-shadow:2px 2px 0 var(--ink);
  font-variant-numeric:tabular-nums;white-space:nowrap}
#snd{pointer-events:auto;font:600 13px var(--body);color:var(--ink);background:var(--foam);border:2px solid var(--ink);
  border-radius:999px;padding:5px 12px;cursor:pointer}
#snd:focus-visible,.btn:focus-visible{outline:3px solid var(--sun);outline-offset:3px}

.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:rgba(75,47,143,.18)}
.card{width:min(460px,100%);background:rgba(246,242,255,.94);border:3px solid var(--ink);border-radius:26px;
  padding:26px 26px 22px;box-shadow:-6px -5px 0 var(--cyan),6px 5px 0 var(--pink);display:grid;gap:14px;text-align:left}
.eyebrow{margin:0;font:600 12px var(--body);letter-spacing:.14em;color:var(--pink)}
h1,h2{margin:0;font-family:var(--display);font-weight:400;line-height:1;color:var(--ink);text-wrap:balance}
h1{font-size:clamp(44px,9vw,64px);text-shadow:-3px -2px 0 var(--cyan),3px 2px 0 var(--pink)}
h2{font-size:clamp(48px,10vw,72px);text-shadow:-3px -2px 0 var(--cyan),3px 2px 0 var(--pink)}
.card p{margin:0;font-size:15px;line-height:1.6}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0;padding:0;list-style:none}
.legend li{display:flex;align-items:center;gap:8px;font-size:13px;line-height:1.35;background:#fff;border:2px solid #ddd3f3;border-radius:12px;padding:7px 9px;min-width:0}
.dot{flex:0 0 14px;height:14px;border-radius:50%;border:2px solid var(--ink)}
.dot.bad{background:#7d3fb5}.dot.jelly{background:#ffb3dc}.dot.hook{background:#e8e6f5}.dot.rock{background:var(--sun);border-radius:4px}
.btn{font-family:var(--display);font-size:26px;color:var(--foam);background:var(--ink);border:0;border-radius:16px;
  padding:14px 18px;cursor:pointer;box-shadow:-4px -3px 0 var(--cyan),4px 3px 0 var(--pink);transition:transform .12s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(1px)}
.hint{font-size:13px !important;color:#6d5aa6;text-align:center}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stats div{background:#fff;border:2px solid #ddd3f3;border-radius:14px;padding:10px 12px;display:grid;gap:2px}
.stats span{font-size:12px;letter-spacing:.06em;color:#6d5aa6}
.stats b{font-family:var(--display);font-weight:400;font-size:30px;font-variant-numeric:tabular-nums}
@media (max-width:420px){.legend{grid-template-columns:1fr}.card{padding:22px 18px 18px}}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>

<div id="stage">
  <canvas id="cv" aria-label="돌고래 대시 게임 화면"></canvas>

  <div id="hud">
    <div class="bar"><div class="fill" id="fill"></div></div>
    <span class="stat" id="pct">0%</span>
    <span class="stat" id="att">시도 1</span>
    <span class="stat" id="best">최고 0%</span>
    <button id="snd" type="button">소리 켜짐</button>
  </div>

  <div class="overlay" id="startOv">
    <div class="card">
      <p class="eyebrow">부스 미니게임</p>
      <h1>돌고래 대시</h1>
      <p>화면을 누르면 점프하고, 공중에서 한 번 더 누르면 2단 점프해요. 장애물을 피해 골인 지점까지 헤엄쳐 가세요.</p>
      <ul class="legend">
        <li><span class="dot bad"></span>성게: 닿으면 처음부터</li>
        <li><span class="dot jelly"></span>해파리: 위아래로 둥실둥실</li>
        <li><span class="dot hook"></span>낚싯바늘: 너무 높이 뛰지 않기</li>
        <li><span class="dot rock"></span>산호 바위: 위에 올라탈 수 있음</li>
      </ul>
      <button class="btn" id="startBtn" type="button">시작하기</button>
      <p class="hint">스페이스바 · 마우스 클릭 · 화면 터치 &nbsp;|&nbsp; Esc: 처음 화면</p>
    </div>
  </div>

  <div class="overlay" id="winOv" hidden>
    <div class="card">
      <p class="eyebrow">골인 지점 도착</p>
      <h2>골인!</h2>
      <div class="stats">
        <div><span>도전 횟수</span><b id="wAtt">1회</b></div>
        <div><span>완주 기록</span><b id="wTime">0.0초</b></div>
      </div>
      <button class="btn" id="againBtn" type="button">처음 화면으로</button>
    </div>
  </div>
</div>

<script>
(() => {
"use strict";
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);

// ---------- palette (canvas) ----------
const INK = '#4b2f8f', CY = '#43d3df', PK = '#e04aa9', FOAM = '#f6f2ff';
const DISPLAY = '"Jua","Arial Rounded MT Bold","Malgun Gothic",sans-serif';

// ---------- physics (units: tiles, seconds) ----------
const SPEED = 8, G = 55, V1 = 15.5, V2 = 14, MAXFALL = 24;
const PW = 0.9, PH = 0.6, START = 2;
const STEP = 1 / 120;

// ---------- level ----------
const L = [];
const spike = (x, n = 1, y = 0) => { for (let i = 0; i < n; i++) L.push({ k: 'spike', x: x + i, y }); };
const block = (x, y, w, h) => L.push({ k: 'block', x, y, w, h });
const jelly = (x, y, amp = 0.25) => L.push({ k: 'jelly', x, y, amp });
const hook = (x, y) => L.push({ k: 'hook', x, y });

// 1. 워밍업
spike(16); spike(26); spike(34, 2); spike(44, 3);
// 2. 산호 바위 계단
block(54, 0, 3, 1); spike(57, 2);
block(64, 0, 2, 1); spike(66, 2);
block(68, 0, 2, 2); spike(70, 2);
block(72, 0, 3, 3); spike(75, 4);
// 3. 해파리 숲
jelly(88, 1.0, 0.3);
spike(96); jelly(96.5, 3.6, 0.15);
spike(104); jelly(104.5, 3.6, 0.15);
jelly(112, 1.0, 0.35); jelly(119, 1.0, 0.35);
// 4. 높은 벽 (2단 점프) + 낚싯바늘
block(130, 0, 1, 2.5);
spike(137.5); hook(138, 4.2);
block(146, 0, 3, 2.5); spike(149, 2);
// 5. 피날레
block(160, 0, 8, 1); spike(164.5, 1, 1);
spike(176); jelly(176.5, 3.6, 0.15);
spike(183.5); hook(184, 4.2);
block(192, 0, 1, 2.6);
spike(200, 3);
jelly(208, 1.0, 0.3);
spike(214); spike(219, 2);
const GOAL = 230, FINISH = GOAL + 1.75;
// decoration seed for rock holes
L.forEach((o, i) => { o.seed = i * 7.31; });

// ---------- helpers ----------
const hash = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rectHit = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const circRect = (cx, cy, r, b) => {
  const px = clamp(cx, b.x, b.x + b.w), py = clamp(cy, b.y, b.y + b.h);
  return (cx - px) ** 2 + (cy - py) ** 2 < r * r;
};
const jellyY = (o, t) => o.y + Math.sin(t * 2.2 + o.x) * o.amp;

// ---------- view ----------
let W = 0, H = 0, DPR = 1, T = 60, groundY = 0, playTop = 0;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  T = Math.min(H / 9, W / 12);
  playTop = (H - 9 * T) / 2;
  groundY = playTop + 7.3 * T;
  buildDeco();
}

// ---------- state ----------
let state = 'title';          // title | play | dead | win
let attempts = 1, best = 0, runTime = 0, deadTimer = 0, winTimer = 0;
let shake = 0, clock = 0, trailT = 0, deathPct = 0, deathPos = null;
const p = { x: START, y: 0, vy: 0, ground: true, jumps: 0, coyote: 0, buffer: 0, spin: 1, land: 0 };
let camX = 0;
const parts = [];
let ambient = [], deco = [], decoPeriod = 1800;

function resetRun() {
  Object.assign(p, { x: START, y: 0, vy: 0, ground: true, jumps: 0, coyote: 0, buffer: 0, spin: 1, land: 0 });
  runTime = 0;
}
function pct() { return Math.floor(clamp((p.x - START) / (FINISH - START), 0, 1) * 100); }

// ---------- audio ----------
let actx = null, soundOn = true;
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(f1, f2, dur, type = 'sine', vol = 0.12, delay = 0) {
  if (!soundOn || !actx) return;
  const t0 = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t0); o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + dur + 0.02);
}
const sfx = {
  jump: () => tone(480, 760, 0.13),
  dbl: () => tone(680, 1180, 0.16, 'sine', 0.11),
  die: () => { tone(320, 70, 0.4, 'triangle', 0.16); tone(900, 200, 0.25, 'sine', 0.05); },
  win: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, f * 1.01, 0.22, 'triangle', 0.12, i * 0.11)),
};

// ---------- input ----------
function press() {
  if (state === 'play') p.buffer = 0.12;
}
cv.addEventListener('pointerdown', e => { e.preventDefault(); audio(); press(); });
addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
    e.preventDefault();
    if (e.repeat) return;
    if (state === 'title') { startGame(); return; }
    press();
  } else if (e.code === 'Enter' && state === 'title') { startGame(); }
  else if (e.code === 'Escape') { toTitle(); }
  else if (e.code === 'KeyR' && (state === 'play' || state === 'dead')) { attempts++; resetRun(); state = 'play'; hud(); }
});
$('startBtn').addEventListener('click', startGame);
$('againBtn').addEventListener('click', toTitle);
$('snd').addEventListener('click', () => { soundOn = !soundOn; $('snd').textContent = soundOn ? '소리 켜짐' : '소리 꺼짐'; audio(); });

function startGame() {
  audio();
  $('startOv').hidden = true; $('winOv').hidden = true;
  attempts = 1; best = 0; resetRun(); state = 'play'; hud();
  cv.focus?.();
}
function toTitle() {
  state = 'title'; resetRun(); attempts = 1; best = 0; hud();
  $('winOv').hidden = true; $('startOv').hidden = false;
  $('startBtn').focus();
}
function hud() {
  const v = state === 'dead' ? deathPct : pct();
  $('fill').style.width = v + '%';
  $('pct').textContent = v + '%';
  $('att').textContent = '시도 ' + attempts;
  $('best').textContent = '최고 ' + best + '%';
}

// ---------- particles ----------
function burst(x, y, n, kind) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 6;
    parts.push({
      x, y, vx: Math.cos(a) * s + (kind === 'conf' ? 0 : SPEED * 0.2), vy: Math.sin(a) * s + 2,
      r: kind === 'conf' ? 0.09 : 0.06 + Math.random() * 0.16, life: 0, max: 0.6 + Math.random() * 0.7, kind,
      c: [CY, PK, '#f8d64a', FOAM][i % 4], rot: Math.random() * 6,
    });
  }
}

function die() {
  state = 'dead'; deadTimer = 0.85; shake = 0.35;
  deathPct = pct(); best = Math.max(best, deathPct);
  deathPos = { x: p.x, y: p.y + 0.35 };
  burst(p.x, p.y + 0.35, 28, 'bubble');
  sfx.die(); hud();
}

// ---------- simulation ----------
function step(dt) {
  clock += dt;
  if (state === 'play' || state === 'win') {
    if (state === 'play') runTime += dt;
    // jumps (buffered + coyote time)
    if (state === 'win' && p.ground && Math.random() < 0.03) p.buffer = 0.05;
    if (p.buffer > 0) {
      if (p.ground || (p.coyote > 0 && p.jumps === 0)) {
        p.vy = V1; p.jumps = 1; p.coyote = 0; p.buffer = 0; p.ground = false; sfx.jump();
      } else if (p.jumps < 2) {
        p.vy = V2; p.jumps = 2; p.buffer = 0; p.spin = 0; sfx.dbl();
        burst(p.x - 0.3, p.y + 0.2, 6, 'bubble');
      }
    }
    p.buffer = Math.max(0, p.buffer - dt);

    p.x += SPEED * dt;
    p.vy = Math.max(-MAXFALL, p.vy - G * dt);
    const prevY = p.y, wasGround = p.ground;
    p.y += p.vy * dt;
    p.ground = false;
    if (p.y <= 0) { p.y = 0; p.vy = 0; p.ground = true; }

    const box = { x: p.x - PW / 2, y: p.y, w: PW, h: PH };
    for (const o of L) {
      if (o.x > p.x + 3 || (o.x + (o.w || 1)) < p.x - 3) continue;
      if (o.k === 'block') {
        const b = { x: o.x, y: o.y, w: o.w, h: o.h };
        if (rectHit(box, b)) {
          const top = o.y + o.h;
          if (prevY >= top - 0.2 && p.vy <= 0) { p.y = top; p.vy = 0; p.ground = true; box.y = top; }
          else if (state === 'play') { die(); return; }
        }
      } else if (state === 'play') {
        let hit = false;
        if (o.k === 'spike') hit = rectHit(box, { x: o.x + 0.25, y: o.y, w: 0.5, h: 0.55 });
        else if (o.k === 'jelly') hit = circRect(o.x, jellyY(o, clock), 0.32, box);
        else if (o.k === 'hook') hit = rectHit(box, { x: o.x - 0.3, y: o.y, w: 0.42, h: 0.55 }) || rectHit(box, { x: o.x - 0.05, y: o.y, w: 0.1, h: 30 });
        if (hit) { die(); return; }
      }
    }
    if (p.ground) {
      if (!wasGround && p.jumps > 0) p.land = 0.12;
      p.jumps = 0; p.coyote = 0.08;
    } else p.coyote = Math.max(0, p.coyote - dt);
    p.spin = Math.min(1, p.spin + dt / 0.5);
    p.land = Math.max(0, p.land - dt);

    trailT -= dt;
    if (trailT <= 0) {
      trailT = 0.06;
      parts.push({ x: p.x - 0.85, y: p.y + 0.35 + (Math.random() - 0.5) * 0.2, vx: -1, vy: 1 + Math.random(), r: 0.04 + Math.random() * 0.06, life: 0, max: 0.8, kind: 'bubble' });
    }

    if (state === 'play' && p.x >= FINISH) {
      state = 'win'; winTimer = 1.3; best = 100;
      burst(FINISH, 3.5, 60, 'conf'); sfx.win(); hud();
    }
    if (state === 'win') {
      winTimer -= dt;
      if (winTimer <= 0 && $('winOv').hidden) {
        $('wAtt').textContent = attempts + '회';
        $('wTime').textContent = runTime.toFixed(1) + '초';
        $('winOv').hidden = false;
        $('againBtn').focus();
      }
    }
  } else if (state === 'dead') {
    deadTimer -= dt;
    if (deadTimer <= 0) { attempts++; resetRun(); state = 'play'; }
  }

  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i];
    q.life += dt;
    if (q.life >= q.max) { parts.splice(i, 1); continue; }
    if (q.kind === 'conf') { q.vy -= 9 * dt; q.rot += dt * 8; } else { q.vy += 3 * dt; q.vx *= 0.98; }
    q.x += q.vx * dt; q.y += q.vy * dt;
  }
  for (const b of ambient) {
    b.y -= b.sp * dt;
    if (state === 'play' || state === 'win') b.x -= SPEED * T * dt * 0.25 * b.depth;
    if (b.y < -10) { b.y = H + 10; b.x = Math.random() * W; }
    if (b.x < -10) b.x += W + 20;
  }
  shake = Math.max(0, shake - dt);
  if (state === 'play' || state === 'win' || state === 'dead') hud();
}

// ---------- background content ----------
function buildDeco() {
  decoPeriod = Math.max(1800, W + 400);
  deco = [];
  const kinds = ['shell', 'star', 'wave', 'boat', 'wave', 'shell'];
  for (let i = 0; i < 30; i++) {
    deco.push({ x: hash(i + 1) * decoPeriod, y: 0.06 + hash(i + 50) * 0.62, k: kinds[i % kinds.length], s: 18 + hash(i + 90) * 26, r: (hash(i + 130) - 0.5) * 0.8 });
  }
  ambient = [];
  for (let i = 0; i < 40; i++) ambient.push({ x: Math.random() * W, y: Math.random() * H, r: 1.5 + Math.random() * 4.5, sp: 18 + Math.random() * 40, depth: 0.4 + Math.random() * 0.8 });
}

function drawLineArt(d, x, y) {
  const s = d.s;
  ctx.save(); ctx.translate(x, y); ctx.rotate(d.r);
  ctx.beginPath();
  if (d.k === 'shell') {
    ctx.moveTo(0, s * 0.5);
    ctx.arc(0, s * 0.5, s, Math.PI * 1.15, Math.PI * 1.85);
    ctx.closePath();
    for (let i = 1; i < 5; i++) { const a = Math.PI * (1.15 + 0.7 * i / 5); ctx.moveTo(0, s * 0.5); ctx.lineTo(Math.cos(a) * s, s * 0.5 + Math.sin(a) * s); }
  } else if (d.k === 'star') {
    for (let i = 0; i <= 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? s * 0.38 : s * 0.8; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  } else if (d.k === 'wave') {
    ctx.moveTo(-s * 1.2, 0);
    for (let i = 0; i < 3; i++) ctx.quadraticCurveTo(-s * 1.2 + s * 0.8 * i + s * 0.4, -s * 0.45, -s * 1.2 + s * 0.8 * (i + 1), 0);
  } else {
    ctx.moveTo(-s, 0); ctx.lineTo(s, 0); ctx.lineTo(s * 0.7, s * 0.35); ctx.lineTo(-s * 0.7, s * 0.35); ctx.closePath();
    ctx.moveTo(0, 0); ctx.lineTo(0, -s * 1.3); ctx.lineTo(s * 0.75, -s * 0.15); ctx.lineTo(0, -s * 0.15);
  }
  ctx.stroke(); ctx.restore();
}

function drawBackground(sx) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#8fd8dc'); g.addColorStop(0.45, '#b1b8e6'); g.addColorStop(0.8, '#c67bc4'); g.addColorStop(1, '#b9549f');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // light rays
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  for (let i = 0; i < 5; i++) {
    const x0 = W * (0.05 + 0.22 * i) + Math.sin(clock * 0.3 + i * 1.7) * 30;
    ctx.beginPath(); ctx.moveTo(x0, 0); ctx.lineTo(x0 + 70, 0); ctx.lineTo(x0 + 220, H); ctx.lineTo(x0 + 60, H); ctx.closePath(); ctx.fill();
  }

  // line-art pattern, like the artwork's background (far parallax)
  ctx.strokeStyle = 'rgba(255,255,255,0.26)'; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  const off = sx * 0.15;
  for (const d of deco) {
    let x = ((d.x - off) % decoPeriod + decoPeriod) % decoPeriod - 200;
    if (x > W + 60) continue;
    drawLineArt(d, x, playTop + d.y * 7.3 * T);
  }

  // kelp (mid parallax)
  ctx.strokeStyle = 'rgba(82,40,140,0.22)'; ctx.lineWidth = Math.max(6, T * 0.22);
  const ko = sx * 0.5, sp = 130;
  for (let i = Math.floor(ko / sp) - 1; i < (ko + W) / sp + 1; i++) {
    const bx = i * sp - ko + hash(i) * 70, hgt = (1.4 + hash(i + 7) * 2.8) * T;
    if (hash(i + 3) < 0.35) continue;
    ctx.beginPath(); ctx.moveTo(bx, groundY + 6);
    for (let k = 1; k <= 8; k++) {
      const yy = groundY - hgt * k / 8;
      ctx.lineTo(bx + Math.sin(clock * 1.3 + i + k * 0.6) * 10 * k / 8, yy);
    }
    ctx.stroke();
  }

  // ambient bubbles
  ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1.5;
  for (const b of ambient) { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.stroke(); }
}

// ---------- world drawing ----------
let shX = 0, shY = 0;
function setWorld() { ctx.setTransform(DPR * T, 0, 0, -DPR * T, DPR * (shX - camX * T), DPR * (groundY + shY)); }

// outline treatment from the artwork: cyan + pink offset strokes behind a purple ink line
function ink(path, fill, lw, dx, dy, c1 = CY, c2 = PK) {
  ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.lineWidth = lw;
  ctx.save(); ctx.translate(dx, dy); ctx.strokeStyle = c1; ctx.stroke(path); ctx.restore();
  ctx.save(); ctx.translate(-dx, -dy); ctx.strokeStyle = c2; ctx.stroke(path); ctx.restore();
  ctx.strokeStyle = INK; ctx.stroke(path);
  if (fill) { ctx.fillStyle = fill; ctx.fill(path); }
}
const WO = [-0.045, 0.032]; // world-space offset (y up)

function drawBlock(o) {
  const pth = new Path2D();
  if (pth.roundRect) pth.roundRect(o.x, o.y, o.w, o.h, 0.18); else pth.rect(o.x, o.y, o.w, o.h);
  const g = ctx.createLinearGradient(0, o.y + o.h, 0, o.y);
  g.addColorStop(0, '#fbe27a'); g.addColorStop(1, '#f2b83c');
  ink(pth, g, 0.08, WO[0], WO[1], '#5cc46a', PK);
  ctx.fillStyle = 'rgba(214,140,30,0.45)';
  const n = Math.ceil(o.w * o.h * 1.6);
  for (let i = 0; i < n; i++) {
    const hx = o.x + 0.2 + hash(o.seed + i) * (o.w - 0.4), hy = o.y + 0.2 + hash(o.seed + i + 40) * (o.h - 0.4);
    ctx.beginPath(); ctx.ellipse(hx, hy, 0.07 + hash(i + o.seed) * 0.05, 0.05, 0, 0, Math.PI * 2); ctx.fill();
  }
}

function drawUrchin(o) {
  const cx = o.x + 0.5, cy = o.y + 0.24;
  const pth = new Path2D();
  const n = 16;
  for (let i = 0; i <= n * 2; i++) {
    const a = i * Math.PI / n, rr = i % 2 ? 0.26 : 0.5 + (i % 4 === 0 ? 0.06 : 0);
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    i ? pth.lineTo(x, y) : pth.moveTo(x, y);
  }
  pth.closePath();
  ink(pth, '#7d3fb5', 0.06, WO[0], WO[1]);
  ctx.fillStyle = '#5a2a92'; ctx.beginPath(); ctx.arc(cx, cy, 0.24, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.beginPath(); ctx.arc(cx - 0.08, cy + 0.1, 0.06, 0, Math.PI * 2); ctx.fill();
}

function drawJelly(o) {
  const cx = o.x, cy = jellyY(o, clock), pulse = 1 + Math.sin(clock * 4 + o.x) * 0.06;
  const glow = ctx.createRadialGradient(cx, cy, 0.05, cx, cy, 0.8);
  glow.addColorStop(0, 'rgba(255,200,235,0.55)'); glow.addColorStop(1, 'rgba(255,200,235,0)');
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(cx, cy, 0.8, 0, Math.PI * 2); ctx.fill();
  // tentacles
  ctx.lineWidth = 0.045; ctx.strokeStyle = INK; ctx.lineCap = 'round';
  for (let i = 0; i < 4; i++) {
    const tx = cx - 0.24 + i * 0.16;
    ctx.beginPath(); ctx.moveTo(tx, cy - 0.08);
    for (let k = 1; k <= 5; k++) ctx.lineTo(tx + Math.sin(clock * 5 + i + k) * 0.06, cy - 0.08 - k * 0.12);
    ctx.stroke();
  }
  const w = 0.38 * pulse, h = 0.42 / pulse;
  const pth = new Path2D();
  pth.moveTo(cx - w, cy - 0.06);
  pth.bezierCurveTo(cx - w, cy + h, cx + w, cy + h, cx + w, cy - 0.06);
  for (let i = 0; i < 4; i++) {
    const x0 = cx + w - (i + 1) * (2 * w / 4);
    pth.quadraticCurveTo(x0 + w / 4, cy - 0.16, x0, cy - 0.06);
  }
  pth.closePath();
  ink(pth, 'rgba(255,179,220,0.92)', 0.06, WO[0], WO[1]);
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.beginPath(); ctx.ellipse(cx - 0.14, cy + 0.17, 0.08, 0.045, 0.5, 0, Math.PI * 2); ctx.fill();
}

function drawHook(o) {
  const x = o.x, y = o.y;
  ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(75,47,143,0.75)'; ctx.lineWidth = 0.035;
  ctx.beginPath(); ctx.moveTo(x, y + 0.55); ctx.lineTo(x, 12); ctx.stroke();
  const pth = new Path2D();
  pth.moveTo(x, y + 0.6); pth.lineTo(x, y + 0.2);
  pth.quadraticCurveTo(x, y, x - 0.15, y);
  pth.quadraticCurveTo(x - 0.3, y, x - 0.3, y + 0.2);
  pth.lineTo(x - 0.22, y + 0.14);
  ctx.lineJoin = 'round';
  ctx.lineWidth = 0.13; ctx.strokeStyle = INK; ctx.stroke(pth);
  ctx.lineWidth = 0.055; ctx.strokeStyle = '#e8e6f5'; ctx.stroke(pth);
  // bait
  ctx.fillStyle = PK; ctx.beginPath(); ctx.ellipse(x - 0.05, y + 0.42, 0.07, 0.13, 0.3, 0, Math.PI * 2); ctx.fill();
}

function drawFloor(vw) {
  const x0 = camX - 2, x1 = camX + vw + 2;
  const g = ctx.createLinearGradient(0, 0, 0, -(H - groundY) / T);
  g.addColorStop(0, '#f3b9d3'); g.addColorStop(1, '#a8489a');
  ctx.fillStyle = g; ctx.fillRect(x0, -20, x1 - x0, 20);
  ctx.fillStyle = 'rgba(122,60,160,0.35)';
  for (let i = Math.floor(x0); i < x1; i++) {
    const h1 = hash(i);
    if (h1 < 0.45) continue;
    ctx.beginPath(); ctx.ellipse(i + hash(i + 9), -0.3 - hash(i + 4) * 0.9, 0.08 + h1 * 0.08, 0.05, 0, 0, Math.PI * 2); ctx.fill();
  }
  const edge = new Path2D(); edge.moveTo(x0, 0); edge.lineTo(x1, 0);
  ink(edge, null, 0.09, WO[0], WO[1]);
}

function drawGoal() {
  const a = GOAL, b = GOAL + 3.5, top = 5.6;
  for (const px of [a, b]) {
    const pole = new Path2D(); pole.rect(px - 0.22, 0, 0.44, top);
    ink(pole, FOAM, 0.08, WO[0], WO[1]);
    ctx.fillStyle = INK;
    for (let i = 0; i < top / 0.44; i++) ctx.fillRect(px - 0.22 + (i % 2) * 0.22, i * 0.44, 0.22, 0.44);
  }
  const ban = new Path2D();
  if (ban.roundRect) ban.roundRect(a - 0.5, top - 1.1, b - a + 1, 1.3, 0.3); else ban.rect(a - 0.5, top - 1.1, b - a + 1, 1.3);
  ink(ban, '#f8d64a', 0.09, WO[0], WO[1]);
  // text in screen space
  const sx = ((a + b) / 2 - camX) * T + shX, sy = groundY + shY - (top - 0.45) * T;
  ctx.save(); ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.font = `${Math.round(T * 0.85)}px ${DISPLAY}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = CY; ctx.fillText('GOAL', sx - 2, sy - 2);
  ctx.fillStyle = PK; ctx.fillText('GOAL', sx + 2, sy + 2);
  ctx.fillStyle = INK; ctx.fillText('GOAL', sx, sy);
  ctx.restore(); setWorld();
}

// ---------- dolphin (side view, redrawn from the artwork) ----------
const D = {};
(function buildDolphin() {
  const body = new Path2D();
  body.moveTo(50, 2);
  body.bezierCurveTo(52, -16, 38, -28, 16, -28);
  body.bezierCurveTo(-6, -28, -28, -16, -46, -5);
  body.lineTo(-46, 5);
  body.bezierCurveTo(-30, 14, -14, 26, 6, 26);
  body.bezierCurveTo(30, 26, 49, 18, 50, 2);
  body.closePath();
  const dorsal = new Path2D();
  dorsal.moveTo(0, -26);
  dorsal.bezierCurveTo(-2, -38, -12, -47, -25, -48);
  dorsal.bezierCurveTo(-20, -38, -21, -28, -26, -18);
  dorsal.closePath();
  const tail = new Path2D();
  tail.moveTo(-42, -6);
  tail.quadraticCurveTo(-56, -9, -70, -22);
  tail.quadraticCurveTo(-66, -6, -60, 0);
  tail.quadraticCurveTo(-66, 6, -70, 22);
  tail.quadraticCurveTo(-56, 9, -42, 6);
  tail.closePath();
  const flipper = new Path2D();
  flipper.moveTo(8, 18);
  flipper.bezierCurveTo(6, 30, -4, 38, -16, 39);
  flipper.bezierCurveTo(-10, 32, -8, 25, -8, 19);
  flipper.closePath();
  const mouth = new Path2D(); mouth.ellipse(36, 8, 11, 7.5, -0.3, 0, Math.PI * 2);
  const tongue = new Path2D(); tongue.ellipse(34, 11.5, 6, 3, -0.3, 0, Math.PI * 2);
  const eye = new Path2D(); eye.ellipse(21, -10, 3.4, 6.2, 0.15, 0, Math.PI * 2);
  Object.assign(D, { body, dorsal, tail, flipper, mouth, tongue, eye });
})();

function drawDolphin(x, y, ang, t) {
  const DS = 0.0155;
  const sq = p.land > 0 ? 1 - p.land * 1.2 : 1;
  setWorld();
  ctx.translate(x - 0.05, y + 0.38);
  ctx.rotate(ang);
  ctx.scale(DS * (2 - sq), -DS * sq);

  const all = new Path2D();
  const tm = new DOMMatrix().translate(-42, 0).rotate(Math.sin(t * 12) * 16).translate(42, 0);
  const fm = new DOMMatrix().translate(4, 19).rotate(Math.sin(t * 12 + 1) * 10).translate(-4, -19);
  all.addPath(D.tail, tm);
  all.addPath(D.dorsal);
  all.addPath(D.flipper, fm);
  all.addPath(D.body);

  const g = ctx.createLinearGradient(-60, -40, 50, 30);
  g.addColorStop(0, '#bfe6f2'); g.addColorStop(0.5, '#f3efff'); g.addColorStop(1, '#dcc6f1');
  ink(all, g, 6, -3, -2);

  // diagonal stripes
  ctx.save(); ctx.clip(all);
  ctx.strokeStyle = 'rgba(120,96,200,0.22)'; ctx.lineWidth = 2.6;
  ctx.beginPath();
  for (let k = -130; k < 130; k += 8) { ctx.moveTo(k - 60, -60); ctx.lineTo(k + 60, 60); }
  ctx.stroke();
  ctx.restore();

  ink(D.mouth, '#6b3fa6', 3.5, -1.6, -1.2);
  ctx.fillStyle = '#d27bd0'; ctx.fill(D.tongue);
  ink(D.eye, INK, 2, -1.2, -0.8);
  ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(22, -13, 1.4, 0, Math.PI * 2); ctx.fill();
}

function render() {
  const vw = W / T;
  if (state !== 'dead') camX = p.x - (W * 0.28) / T;
  shX = shake > 0 ? (Math.random() - 0.5) * 14 * shake : 0;
  shY = shake > 0 ? (Math.random() - 0.5) * 14 * shake : 0;

  drawBackground(camX * T);
  setWorld();
  const vis = o => o.x + (o.w || 1) > camX - 2 && o.x < camX + vw + 2;
  for (const o of L) if (o.k === 'block' && vis(o)) drawBlock(o);
  for (const o of L) if (o.k === 'spike' && vis(o)) drawUrchin(o);
  drawFloor(vw);
  if (GOAL + 5 > camX && GOAL - 2 < camX + vw) drawGoal();
  for (const o of L) if (o.k === 'jelly' && vis(o)) drawJelly(o);
  for (const o of L) if (o.k === 'hook' && vis(o)) drawHook(o);

  if (state !== 'dead') {
    let ang = clamp(p.vy * 0.03, -0.55, 0.55);
    if (p.ground) ang = Math.sin(clock * 6) * 0.04;
    if (state === 'title') ang = Math.sin(clock * 2) * 0.08;
    const e = 1 - Math.pow(1 - p.spin, 3);
    ang += e * Math.PI * 2;
    const bob = state === 'title' ? Math.sin(clock * 2.4) * 0.15 + 0.15 : 0;
    drawDolphin(p.x, p.y + bob, ang, clock);
  }

  setWorld();
  for (const q of parts) {
    const k = 1 - q.life / q.max;
    if (q.kind === 'conf') {
      ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot);
      ctx.fillStyle = q.c; ctx.globalAlpha = k; ctx.fillRect(-q.r, -q.r * 0.5, q.r * 2, q.r);
      ctx.restore();
    } else {
      ctx.globalAlpha = k * 0.9; ctx.strokeStyle = FOAM; ctx.lineWidth = 0.03;
      ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, Math.PI * 2); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (state === 'dead' && deathPos) {
    const sx = (deathPos.x - camX) * T, sy = groundY - (deathPos.y + 1.3) * T - (0.85 - deadTimer) * 40;
    ctx.font = `${Math.round(T * 0.7)}px ${DISPLAY}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.globalAlpha = clamp(deadTimer * 2, 0, 1);
    ctx.fillStyle = PK; ctx.fillText(deathPct + '%', sx + 2, sy + 2);
    ctx.fillStyle = FOAM; ctx.fillText(deathPct + '%', sx, sy);
    ctx.globalAlpha = 1;
  }
  const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
  v.addColorStop(0, 'rgba(60,20,110,0)'); v.addColorStop(1, 'rgba(60,20,110,0.28)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

// ---------- loop ----------
let last = 0, acc = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0);
  last = ts; acc += dt;
  while (acc >= STEP) { step(STEP); acc -= STEP; }
  render();
  requestAnimationFrame(frame);
}

function boot(data) {
  data = data || {};
  resize();
  addEventListener('resize', resize);
  hud();
  try { window.claude?.hot?.snapshot?.(() => ({ v: 1 })); } catch (e) {}
  if (document.fonts && document.fonts.load) document.fonts.load(`40px "Jua"`).catch(() => {});
  requestAnimationFrame(ts => { last = ts; frame(ts); });
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
